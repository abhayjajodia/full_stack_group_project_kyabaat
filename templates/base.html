<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyabaat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="../static/css/base.css" rel="stylesheet">
        <!-- Favicon: prefer using static url_for and correct SVG MIME type. 
            browsers that support SVG will use this; if you want consistent sizing
            across platforms, add PNG favicons (16x16, 32x32) to `static/images/`
            and reference them with sizes and type attributes. -->
        <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml" sizes="any">
        <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
        <meta name="theme-color" content="#ffffff">
</head>
<body>
    {% block content %}
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
